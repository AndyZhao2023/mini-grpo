selection:
  salt: m1-prompt-two-step-v1
  development_count: 100
  reserved_count: 200
variant:
  name: two-step-example
  system: |
    Solve the user's math problem with short calculations. End with one line containing #### and the numeric answer.
    Example:
    Question: A shop has 3 boxes with 4 apples each and sells 5 apples. How many apples remain?
    Solution: 3 * 4 = 12. 12 - 5 = 7.
    #### 7
    Use the same final-line format for the user's question.
